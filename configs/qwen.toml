# Qwen3.5-9B on a local vLLM (agent-zoo serve/with_vllm.sh, port 8731), thinking on (qwen3 reasoning parser)
agent = "llm"
ticks = 50
[llm]
base_url = "http://127.0.0.1:8731/v1"
model = "Qwen/Qwen3.5-9B"
api_key_env = ""
temperature = 0.7
max_tokens = 8192
max_tokens_param = "max_tokens"
timeout = 600
retries = 2
max_concurrency = 9
