# T_text stage 4: sol_api.toml with reasoning effort medium (the only change), 30 ticks. see prereg/T_text.md.
agent = "llm"
ticks = 30
cost_cap_usd = 5.5
[llm]
base_url = "https://openrouter.ai/api/v1"
model = "openai/gpt-6.1-sol"
api_key_env = "OPENROUTER_API_KEY"
temperature = ""
max_tokens = 16000
max_tokens_param = "max_completion_tokens"
timeout = 300
retries = 3
max_concurrency = 9
extra_body = {reasoning = {effort = "medium"}, provider = {order = ["openai"], allow_fallbacks = false}, usage = {include = true}}
