# gpt-6.1-sol via OpenRouter (erin's showcase model; reasoning effort high as in her config)
agent = "llm"
ticks = 50
cost_cap_usd = 10
[llm]
base_url = "https://openrouter.ai/api/v1"
model = "openai/gpt-6.1-sol"
api_key_env = "OPENROUTER_API_KEY"
temperature = ""
max_tokens = 16000
max_tokens_param = "max_tokens"
timeout = 300
retries = 3
max_concurrency = 9
[llm.extra_body]
reasoning = { effort = "high" }
usage = { include = true }
